<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Speedreader</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #3FB6A8; --good: #4CC38A; --bad: #E5674F; --piv: #F08A5D;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); }
.big { font-size: 28px; font-weight: 700; }
button { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
button.primary { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 700; }
button.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; }
.row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; } .item > div.grow { flex: 1; min-width: 0; }
.item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { height: 4px; background: #0E1319; border-radius: 2px; overflow: hidden; margin-top: 5px; }
.pbar i { display: block; height: 100%; background: var(--acc); }
label.f { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
label.c { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
input[type=text], input[type=number], textarea { font: inherit; color: var(--txt); background: #0E1319; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
input.short { width: 100px; }
textarea { min-height: 170px; }
input[type=range] { width: 100%; accent-color: var(--acc); }
ul { margin: 6px 0; padding-left: 20px; } li { margin: 4px 0; }

/* Leser: Vollbild */
#reader { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 6px) 0 calc(var(--sab) + 10px); }
#reader[hidden] { display: none; }
#rd-top { display: flex; align-items: center; gap: 6px; padding: 0 10px; min-height: 44px; }
#rd-close { background: none; border: 0; font-size: 28px; padding: 0 10px 4px 0; }
#rd-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#rd-info { font-size: 13px; color: var(--muted); white-space: nowrap; }
#rd-seek { margin: 2px 12px 0; width: calc(100% - 24px); }
#rd-stage { position: relative; height: 150px; display: flex; align-items: center; margin-top: 8px; user-select: none;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#rd-stage::before, #rd-stage::after { content: ''; position: absolute; left: 38%; width: 2px; height: 14px; background: var(--piv); opacity: .7; }
#rd-stage::before { top: 0; } #rd-stage::after { bottom: 0; }
#rd-stage.chunk::before, #rd-stage.chunk::after { display: none; }
#rd-word { display: flex; width: 100%; font-weight: 600; white-space: nowrap; }
#w-l { flex: 0 0 38%; text-align: right; overflow: hidden; }
#w-p { color: var(--piv); } #w-r { flex: 1; overflow: hidden; }
#rd-word.chunk { justify-content: center; } #rd-word.chunk #w-l { flex: 0 0 auto; }
#rd-ctx { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; font-size: 16px; line-height: 1.6; color: var(--muted); }
#rd-ctx span.cur { background: var(--acc); color: #06201D; border-radius: 4px; padding: 0 2px; }
#rd-ctx { overflow-wrap: anywhere; }
#rd-ctx span.sent { color: var(--txt); }
#rd-ctx span.hl { border-bottom: 2px solid var(--warn, #E0A93B); color: var(--txt); }
#rd-ctx.mark span { cursor: pointer; }
#rd-stage[hidden], #rd-tools[hidden] { display: none; }
#rd-tools { display: flex; gap: 6px; padding: 6px 10px 0; }
#rd-tools button { flex: 1; font-size: 14px; padding: 8px 6px; }
.q button { display: block; width: 100%; text-align: left; margin-top: 8px; font-size: 14px; line-height: 1.4; }
.q button.ok { border-color: var(--good); background: #1E3B2E; } .q button.no { border-color: var(--bad); background: #4A2622; }
#rd-ctx .hint { text-align: center; margin-top: 30px; }
#rd-ctl { display: flex; gap: 6px; padding: 6px 10px 0; }
#rd-ctl button { flex: 1; padding: 12px 4px; font-size: 15px; }
#rd-play { flex: 2 !important; }
/* Abend-Farbfilter: liegt ueber allem und multipliziert jede Farbe mit einem warmen, dunkleren Ton */
#tint { position: fixed; inset: 0; z-index: 50; pointer-events: none; mix-blend-mode: multiply; background: #fff; }
.tb { background: none; border: 1px solid var(--line); border-radius: 9px; padding: 5px 9px; font-size: 15px; line-height: 1.2; }
.tb.on { border-color: var(--acc); color: var(--acc); background: #1E3B38; }
#rd-info { text-align: center; padding: 0 12px; }
.sheet { max-height: 62vh; overflow-y: auto; margin-top: 8px; }
.sheet h4 { margin: 14px 0 2px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sheet .item.cur .t { color: var(--acc); font-weight: 600; }
/* Augen-Gym: Vollbild */
#gym { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 6px) 14px calc(var(--sab) + 14px); touch-action: manipulation; }
#gym[hidden] { display: none; }
#g-top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
#g-close { background: none; border: 0; font-size: 28px; padding: 0 10px 4px 0; }
#g-title { flex: 1; font-weight: 600; }
#g-body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.center { text-align: center; }
.sgrid { display: grid; gap: 6px; margin: 14px 0; }
.sgrid button { padding: 0; aspect-ratio: 1; font-weight: 700; }
.sgrid button.hit { opacity: .22; } .sgrid button.err { background: #4A2622; }
.flash { font-size: 44px; font-weight: 700; text-align: center; letter-spacing: .12em; min-height: 70px; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.keys button { font-size: 22px; padding: 13px 0; }
#jump { flex: 1; position: relative; border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; user-select: none; overflow: hidden; }
#jump span { position: absolute; font-size: 46px; font-weight: 700; line-height: 1; }
#jump.ok { border-color: var(--good); } #jump.no { border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden] { display: none; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 6px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Speedreader</h1></header>
  <main id="view"></main>
</div>
<div id="reader" hidden>
  <div id="rd-top"><button id="rd-close" aria-label="Schließen">‹</button><span id="rd-title"></span><button id="rd-mode" class="tb" aria-label="Lesemodus">≡</button><button id="rd-say" class="tb" aria-label="Vorlesen">🔊</button><button id="rd-snd" class="tb" aria-label="Klang">♪</button><button id="rd-mark" class="tb" aria-label="Lesezeichen">🔖</button><button id="rd-menu" class="tb" aria-label="Inhalt">☰</button></div>
  <div id="rd-info"></div>
  <input type="range" id="rd-seek" min="0" max="1" value="0" aria-label="Position">
  <div id="rd-stage"><div id="rd-word"><span id="w-l"></span><span id="w-p"></span><span id="w-r"></span></div></div>
  <div id="rd-ctx"></div>
  <div id="rd-tools" hidden><button id="rd-hl" class="tb">✎ Markieren</button><button id="rd-check" class="tb">Verstanden? Kurzer Check</button></div>
  <div id="rd-ctl">
    <button id="rd-sent" aria-label="Satz zurück">⏮ Satz</button><button id="rd-slow">−25</button>
    <button id="rd-play" class="primary">▶</button><button id="rd-fast">+25</button><button id="rd-chunk">1</button>
  </div>
</div>
<div id="gym" hidden>
  <div id="g-top"><button id="g-close" aria-label="Schließen">‹</button><span id="g-title"></span></div>
  <div id="g-body"></div>
</div>
<div id="modal" hidden><div id="modal-in"></div></div>
<div id="tint"></div>

<script>
'use strict';
// =====================================================================
// Speedreader: eigene Texte Wort fuer Wort lesen (RSVP) mit einstellbarem
// Tempo. Texte aus Zwischenablage, Textdatei, PDF, EPUB (ohne Kopierschutz) oder von
// einer Webseite. Dazu Zeilen-Modus, Vorlesen, Markieren und ein Verstaendnis-Check.
// Aufbau: Daten -> Textaufbereitung (rein) -> EPUB/ZIP -> Leser -> Ansichten
//         -> Selbsttest (srTests, ?debug=1). Details in README.md.
// =====================================================================
const $ = id => document.getElementById(id);
const NATIVE = window.SrAndroid;

// ---------------------------------------------------------------- Daten
const K = { set: 'speedreader.settings.v1', lib: 'speedreader.library.v1', stats: 'speedreader.stats.v1', text: 'speedreader.text.' };
const DEFAULT_SETTINGS = { schema: 1, wpm: 300, chunk: 1, font: 34, pauses: true, ramp: false, rampPerMin: 10, rampMax: 500,
  mode: 'wort', brake: true, ttsLang: 'de', ttsRate: 1.1,       // Lesemodus wort | zeile, Tempo-Bremse, Vorlesen
  klang: 'aus', klangVol: 0.4,                                   // Fokus-Lesen: leiser Klangteppich im Leser
  filter: 'aus', filterMax: 0.8, filterStart: 19, filterFull: 22 };  // Abend-Farbfilter: aus | auto (nach Uhrzeit) | an
let saveOk = true;
function load(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { saveOk = false; return false; } }
const db = { settings: Object.assign({}, DEFAULT_SETTINGS, load(K.set, {})), lib: load(K.lib, []), stats: load(K.stats, {}) };
function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return dstr(new Date()); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Die Texte selbst liegen in IndexedDB (Buecher sprengen localStorage); klappt
// das nicht, als Rueckfall in localStorage.
const Texts = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('speedreader', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('texts');
        r.onsuccess = () => { Texts.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = Texts.db.transaction('texts', mode), rq = fn(t.objectStore('texts'));
      t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  async put(id, text) {
    if (Texts.db) { try { await Texts.tx('readwrite', s => s.put(text, id)); return true; } catch (e) {} }
    try { localStorage.setItem(K.text + id, text); return true; } catch (e) { return false; }
  },
  async get(id) {
    if (Texts.db) { try { const v = await Texts.tx('readonly', s => s.get(id)); if (v != null) return v; } catch (e) {} }
    return localStorage.getItem(K.text + id);
  },
  async del(id) {
    if (Texts.db) { try { await Texts.tx('readwrite', s => s.delete(id)); } catch (e) {} }
    localStorage.removeItem(K.text + id);
  },
};

// ---------------------------------------------------------------- Textaufbereitung
// Sehr lange Woerter in Stuecke teilen, damit sie auf den Bildschirm passen.
function splitLong(w) {
  if (w.length <= 22) return [w];
  const out = []; for (let i = 0; i < w.length; i += 14) out.push(w.slice(i, i + 14) + (i + 14 < w.length ? '-' : ''));
  return out;
}
// Text -> {words, para}. para enthaelt die Indizes, an denen ein neuer Absatz beginnt.
function tokenize(text) {
  const words = [], para = new Set();
  String(text).replace(/\r/g, '').split(/\n\s*\n+/).forEach(p => {
    const w = p.split(/\s+/).filter(Boolean); if (!w.length) return;
    if (words.length) para.add(words.length);
    w.forEach(x => splitLong(x).forEach(y => words.push(y)));
  });
  return { words, para };
}
// Blickpunkt im Wort (etwas links der Mitte), gezaehlt ohne fuehrende Satzzeichen.
function orpIndex(w) {
  let off = 0; while (off < w.length - 1 && /[^0-9A-Za-zÀ-ÿ]/.test(w[off])) off++;
  const core = w.slice(off).replace(/[^0-9A-Za-zÀ-ÿ]+$/, ''), L = core.length;
  return off + (L <= 1 ? 0 : L <= 5 ? 1 : L <= 9 ? 2 : L <= 13 ? 3 : 4);
}
// Anzeigedauer eines Worts als Vielfaches der Grunddauer: lange Woerter, Zahlen,
// Satzzeichen und Absatzenden bekommen mehr Zeit.
function delayFactor(w, endsPara, pauses) {
  let f = 1 + clamp((w.length - 8) * 0.04, 0, 0.6);
  if (/\d/.test(w)) f += 0.4;
  if (!pauses) return f;
  if (endsPara) return f + 1.5;
  if (/[.!?…]["'»«“”)\]]*$/.test(w)) return f + 1.2;
  if (/[,;:–—]$/.test(w)) return f + 0.5;
  return f;
}
// Anfang des Satzes, in dem Wort i steht (oder des Satzes davor, wenn i schon ein Satzanfang ist).
function sentenceStart(words, i) {
  let j = Math.min(i, words.length) - 1;
  while (j > 0 && !/[.!?…]["'»«“”)\]]*$/.test(words[j - 1])) j--;
  return Math.max(0, j);
}
function estMinutes(n, wpm) { return n * 1.25 / wpm; }     // 1,25 = mittlerer Zuschlag durch Pausen
function fmtMin(m) { return m < 1 ? '<1 min' : m < 90 ? Math.round(m) + ' min' : (Math.round(m / 6) / 10).toString().replace('.', ',') + ' h'; }

// ---------------------------------------------------------------- Seiten, Kapitel, Lesezeichen
// Eine "Seite" sind PAGE Woerter: Der Text hat keine echten Seiten, so bleibt die Zahl
// aber von Schriftgroesse und Geraet unabhaengig.
const PAGE = 250;
function pageCount(n) { return Math.max(1, Math.ceil(n / PAGE)); }
function pageOf(i, n) { return clamp(Math.floor(clamp(i, 0, Math.max(0, n - 1)) / PAGE) + 1, 1, pageCount(n)); }
function pageStart(p, n) { return clamp((p - 1) * PAGE, 0, Math.max(0, n - 1)); }
// Sieht ein Absatz wie eine Kapitelueberschrift aus? Kurz, einzeilig und entweder mit
// einem typischen Anfang (Kapitel 3, Teil II, 4., Prolog) oder ganz in Grossbuchstaben.
function isHeading(p) {
  if (p.indexOf('\n') >= 0 || p.length < 2 || p.length > 70 || p.split(/\s+/).length > 10) return false;
  if (/^(kapitel|chapter|teil|part|abschnitt|buch|prolog|epilog|vorwort|nachwort|einleitung|einführung|anhang)\b/i.test(p)) return true;
  if (/^(\d{1,3}|[IVXLC]{1,7})[.:)]?(\s+\S.*)?$/.test(p) && !/[.,;!?]$/.test(p.replace(/^(\d{1,3}|[IVXLC]{1,7})[.:)]?/, ''))) return true;
  return p.length >= 4 && /[A-ZÄÖÜ]/.test(p) && p === p.toUpperCase() && !/[.,;!?]$/.test(p);
}
// Kapitel aus reinem Text: Ueberschriften-Absaetze mit ihrer Wortposition.
function detectChapters(text) {
  const out = []; let count = 0;
  String(text).replace(/\r/g, '').split(/\n\s*\n+/).forEach(p => {
    const w = tokenize(p).words.length; if (!w) return;
    const line = p.trim(); if (isHeading(line)) out.push({ t: line.slice(0, 80), i: count });
    count += w;
  });
  return out.slice(0, 400);
}
// Kapitel aus den Teilen eines EPUB: Teile mit Ueberschrift, dazu lange Teile ohne Ueberschrift.
function chaptersFromParts(parts) {
  const out = []; let count = 0, k = 0;
  parts.forEach(pt => { const w = tokenize(pt.text).words.length; if (!w) return; k++; if (pt.title || w >= 150) out.push({ t: (pt.title || 'Abschnitt ' + k).slice(0, 80), i: count }); count += w; });
  return out.slice(0, 400);
}
// Index des Kapitels, in dem Wort i liegt (-1 = vor dem ersten).
function currentChapter(ch, i) { let c = -1; for (let k = 0; k < ch.length; k++) { if (ch[k].i <= i) c = k; else break; } return c; }
function markNear(list, i) { return list.findIndex(b => Math.abs(b.i - i) < 25); }
// Lesezeichen setzen oder, wenn hier schon eins liegt, wieder entfernen. Liefert true, wenn gesetzt.
function toggleMark(list, i, label, date) {
  const at = markNear(list, i); if (at >= 0) { list.splice(at, 1); return false; }
  list.push({ i, t: label, d: date }); list.sort((a, b) => a.i - b.i); return true;
}

// ---------------------------------------------------------------- ZIP / EPUB
function u16(b, o) { return b[o] | b[o + 1] << 8; }
function u32(b, o) { return (b[o] | b[o + 1] << 8 | b[o + 2] << 16 | b[o + 3] << 24) >>> 0; }
// Liest das Inhaltsverzeichnis einer ZIP-Datei: Name -> {method, csize, off}.
function zipIndex(b) {
  let e = -1; for (let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--) if (u32(b, i) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('Keine ZIP-Datei');
  const n = u16(b, e + 10), files = {}, dec = new TextDecoder(); let p = u32(b, e + 16);
  for (let k = 0; k < n; k++) {
    if (u32(b, p) !== 0x02014b50) throw new Error('ZIP-Verzeichnis beschädigt');
    const nl = u16(b, p + 28), xl = u16(b, p + 30), cl = u16(b, p + 32);
    files[dec.decode(b.subarray(p + 46, p + 46 + nl))] = { method: u16(b, p + 10), csize: u32(b, p + 20), off: u32(b, p + 42) };
    p += 46 + nl + xl + cl;
  }
  return files;
}
async function zipRead(b, f) {
  if (u32(b, f.off) !== 0x04034b50) throw new Error('ZIP-Eintrag beschädigt');
  const start = f.off + 30 + u16(b, f.off + 26) + u16(b, f.off + 28), data = b.subarray(start, start + f.csize);
  if (f.method === 0) return data;
  if (f.method !== 8) throw new Error('Nicht unterstützte ZIP-Kompression');
  if (typeof DecompressionStream === 'undefined') throw new Error('Dieses Gerät kann EPUB nicht entpacken');
  const s = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function resolvePath(base, href) {
  const parts = (base ? base.split('/') : []).concat(decodeURIComponent(href.split('#')[0]).split('/')), out = [];
  parts.forEach(s => { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); });
  return out.join('/');
}
// (X)HTML eines Kapitels -> Absaetze als Text.
// Erste Ueberschrift eines Kapitels (h1 bis h3), sonst leer.
function htmlHeading(html) {
  let doc = new DOMParser().parseFromString(html, 'application/xhtml+xml');
  if (!doc.body || doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(html, 'text/html');
  const h = doc.body && doc.body.querySelector('h1,h2,h3');
  return h ? h.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) : '';
}
function htmlToText(html) {
  let doc = new DOMParser().parseFromString(html, 'application/xhtml+xml');
  if (!doc.body || doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(html, 'text/html');
  if (!doc.body) return '';
  doc.body.querySelectorAll('script,style,nav,svg').forEach(n => n.remove());
  const SEL = 'p,h1,h2,h3,h4,h5,h6,li,blockquote,dt,dd,pre,td', out = [];
  doc.body.querySelectorAll(SEL).forEach(n => { if (n.querySelector(SEL)) return; const t = n.textContent.replace(/\s+/g, ' ').trim(); if (t) out.push(t); });
  return out.length ? out.join('\n\n') : doc.body.textContent.replace(/[ \t]+/g, ' ').trim();
}
// EPUB (ohne Kopierschutz) -> {title, text}
async function parseEpub(bytes) {
  const z = zipIndex(bytes), dec = new TextDecoder(), rd = async n => { if (!z[n]) throw new Error('EPUB unvollständig: ' + n + ' fehlt'); return dec.decode(await zipRead(bytes, z[n])); };

          (next !== ms ? ' · nächstes Mal ' + next + ' ms' : '') + '</div>', gymSprung);
        return;
      }
      let d; if (Math.random() < 0.25) { d = target; targets++; open = { until: i + 1, hit: false }; } else { do { d = Math.floor(Math.random() * 10); } while (d === target); }
      const el = $('jd'); el.textContent = d; el.style.left = i % 2 ? 'auto' : '6%'; el.style.right = i % 2 ? '6%' : 'auto'; el.style.top = 12 + Math.random() * 66 + '%';

    };
    step();
  };
}

  t('splitLong teilt lange Wörter', long.length === 3 && long[0].endsWith('-') && long.join('').replace(/-/g, '') === 'Donaudampfschifffahrtsgesellschaftskapitän', long.join('|'));
